# Render Blueprint: cria o backend com poucos cliques (render.com → New → Blueprint).
services:
  - type: web
    name: afiliados-bot
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: DATA_DIR
        value: /tmp/afiliados-data
      # O Render cria um token aleatório. Copie ele para o app (Ajustes → Backend).
      - key: APP_TOKEN
        generateValue: true
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_DAILY_LIMIT
        value: "300"
      # O Render pede estes valores na hora. Pode deixar em branco e preencher depois.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
      # WhatsApp automático: Postgres grátis do Supabase (Session pooler).
      - key: DATABASE_URL
        sync: false
      - key: WA_INTERVALO_MIN
        value: "10"
      - key: WA_MAX_DIA
        value: "40"
